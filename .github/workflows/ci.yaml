name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.x"

      - name: Lint
        run: deno lint

      - name: Test
        run: deno test --parallel --allow-read=src/mod.ts

      - name: Types
        run: deno check .

      - name: Format
        run: deno fmt --check

      - name: Dry run to publish to JSR
        run: deno publish --dry-run

      - name: Build npm
        run: deno task build:npm
